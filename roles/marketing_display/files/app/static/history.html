<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>S1 Remote Monitoring — History</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f1117'/%3E%3Cpath d='M4 12h4l2.5-5.5 3 11 2.5-5.5H20' fill='none' stroke='%231D9E75' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --bg-deep: #0b0d12;
  --panel: #161b22;
  --panel-raised: #1b212b;
  --border: #232936;
  --border-soft: rgba(255,255,255,0.06);
  --text: #e2e8f0;
  --text-bright: #f4f7fb;
  --muted: #94a3b8;
  --faint: #5f6b7d;
  --green: #1D9E75;
  --red: #E24B4A;
  --amber: #EF9F27;
  --blue: #378ADD;
  --purple: #9b59b6;
  --grey: #6b7280;
  --shadow-panel: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px -12px rgba(0,0,0,.55);
}

html { scrollbar-color: #2a3240 var(--bg); }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  caret-color: var(--blue);
}

::selection { background: rgba(55,138,221,0.35); color: var(--text-bright); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3240; border-radius: 4px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #38424f; }

.icon { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ── TOP BAR ─────────────────────────────────────────────────────────── */
#topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11,13,18,0.88);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 50px;
}

.topbar-left { display: flex; align-items: center; gap: 11px; }

.logo-mark {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: linear-gradient(145deg, #182430, #121820);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 16px; height: 16px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.topbar-title { font-size: 14px; font-weight: 600; color: var(--text-bright); letter-spacing: 0.01em; }

.pill-dws {
  border: 1px solid rgba(29,158,117,0.35);
  color: var(--green);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
}

.page-tag {
  color: var(--blue);
  border: 1px solid rgba(55,138,221,0.3);
  background: rgba(55,138,221,0.08);
  border-radius: 6px;
  padding: 2px 9px;
  font-size: 11px;
  font-weight: 600;
}

.topbar-right { display: flex; align-items: center; gap: 14px; }

.back-link {
  display: inline-flex; align-items: center; gap: 7px;
  color: var(--muted);
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  text-decoration: none;
  transition: color .15s, border-color .15s, background .15s;
}
.back-link:hover { color: var(--text-bright); border-color: #303a48; background: rgba(255,255,255,0.05); }

#utc-clock {
  font-size: 12px; font-weight: 500; color: var(--muted);
  font-variant-numeric: tabular-nums; letter-spacing: 0.03em;
}

/* ── CONTROLS BAR ────────────────────────────────────────────────────── */
#controls-bar {
  background: var(--bg-deep);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px 14px;
}

.ctrl-group { display: flex; flex-direction: column; gap: 5px; }
.ctrl-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

input[type="date"], select.ctrl-select {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  height: 31px;
}
input[type="date"]:hover, select.ctrl-select:hover { border-color: #303a48; }
input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }

.quick-ranges {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  min-height: 31px;
}

.ctrl-sep { width: 1px; align-self: stretch; background: var(--border-soft); margin: 0 4px; }
.qr-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
  font-family: inherit;
}
.qr-btn:hover { color: var(--text); border-color: #303a48; }
.qr-btn.active {
  background: rgba(55,138,221,0.12);
  border-color: rgba(55,138,221,0.5);
  color: var(--blue);
}

#btn-load {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0 18px;
  height: 31px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s;
}
#btn-load:hover { background: #4d9ae4; }
#btn-load:disabled { background: #2c3440; color: var(--muted); cursor: default; }

#ctrl-msg { font-size: 11.5px; color: var(--amber); align-self: center; }
#ctrl-msg:empty { display: none; }

/* ── MAIN ────────────────────────────────────────────────────────────── */
#main { padding: 0 20px 48px; max-width: 1720px; margin: 0 auto; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 30px 2px 12px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--border-soft);
}
.section-head h2 { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.03em; }
.section-head .section-note { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-panel);
  overflow: hidden;
  margin-bottom: 12px;
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 15px 9px;
  border-bottom: 1px solid var(--border-soft);
}
.panel-title { font-size: 12.5px; font-weight: 600; color: var(--text); letter-spacing: 0.01em; }
.panel-sub { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.panel-body { padding: 13px 15px; }

.two-col { display: grid; gap: 12px; margin-bottom: 12px; }
.two-col-5050 { grid-template-columns: 1fr 1fr; }

/* ── PERIOD SUMMARY STRIP ────────────────────────────────────────────── */
.summary-strip {
  display: flex;
  align-items: stretch;
  flex-wrap: wrap;
  gap: clamp(20px, 3vw, 48px);
  margin-top: 16px;
  padding: 18px 22px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-panel);
}
.sum-item { min-width: 0; }
.sum-scope { margin-left: auto; align-self: center; text-align: right; }
.scope-line { font-size: 13px; font-weight: 600; color: var(--text); }
.scope-dates { font-size: 11.5px; color: var(--faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
.sum-value {
  font-size: clamp(24px, 2vw, 32px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--text-bright);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.sum-label { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* ── TABLE ───────────────────────────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; overflow-y: auto; max-height: 460px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel-raised);
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-size: 10px;
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
tbody tr { transition: background .12s; }
tbody tr:hover { background: rgba(55,138,221,0.07); }
tbody td { padding: 6px 10px; border-bottom: 1px solid rgba(35,41,54,0.55); white-space: nowrap; vertical-align: middle; }
tfoot tr { background: var(--panel-raised); }
tfoot td { padding: 8px 10px; font-weight: 700; font-size: 12px; border-top: 1px solid var(--border); }

.pill {
  display: inline-block;
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.pill-green { background: rgba(29,158,117,0.14); color: #2fc394; }
.pill-red   { background: rgba(226,75,74,0.14);  color: #f0706f; }
.pill-amber { background: rgba(239,159,39,0.14); color: #f4b04e; }
.pill-grey  { background: rgba(107,114,128,0.16); color: #9aa1ad; }

/* Chart.js with maintainAspectRatio:false needs a positioned parent with an
   explicit height, or it falls back to width/2 and charts fill the viewport. */
.chart-box { position: relative; width: 100%; height: 260px; }
.chart-box.chart-tall { height: 300px; }

/* ── GAUGE TILES ─────────────────────────────────────────────────────── */
.gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.gauge-body { display: flex; flex-direction: column; align-items: center; padding: 16px 15px 14px; }
.gauge-wrap { position: relative; width: 156px; }
.gauge-wrap svg { width: 100%; display: block; }
.gauge-value {
  position: absolute; left: 0; right: 0; top: 56%;
  text-align: center;
  font-size: 30px; font-weight: 700; line-height: 1;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.gauge-counts { margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gauge-counts b { color: var(--text); font-weight: 600; }
@media (max-width: 900px) { .gauge-grid { grid-template-columns: 1fr; } }

.no-data { text-align: center; color: var(--faint); padding: 40px; font-size: 13px; }
.loading-msg { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 13.5px; }
.loading-msg strong { color: var(--text); }

canvas { display: block; }

@media (max-width: 900px) {
  .two-col-5050 { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="topbar-left">
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12h4l2.5-5.5 3 11 2.5-5.5H20"/></svg>
    </div>
    <span class="topbar-title">S1 Remote Monitoring</span>
    <span class="pill-dws">DWS</span>
    <span class="page-tag">History</span>
  </div>
  <div class="topbar-right">
    <a href="/" class="back-link">
      <svg class="icon" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg>
      Live Dashboard
    </a>
    <span id="utc-clock">--:--:-- UTC</span>
  </div>
</div>

<!-- CONTROLS -->
<div id="controls-bar">
  <div class="ctrl-group">
    <span class="ctrl-label">From</span>
    <input type="date" id="date-from">
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">To</span>
    <input type="date" id="date-to">
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Quick range</span>
    <div class="quick-ranges">
      <button class="qr-btn" onclick="setRange(7)">7 Days</button>
      <button class="qr-btn active" onclick="setRange(30)">30 Days</button>
      <button class="qr-btn" onclick="setRange(90)">90 Days</button>
      <button class="qr-btn" onclick="setRange(180)">6 Months</button>
      <button class="qr-btn" onclick="setRange(365)">1 Year</button>
      <button class="qr-btn" onclick="setThisMonth()">This Month</button>
      <button class="qr-btn" onclick="setLastMonth()">Last Month</button>
    </div>
  </div>
  <div class="ctrl-sep" aria-hidden="true"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">Customer</span>
    <select class="ctrl-select" id="filter-customer" style="min-width:150px">
      <option value="">All Customers</option>
    </select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Machine</span>
    <select class="ctrl-select" id="filter-machine" style="min-width:210px">
      <option value="">All Machines</option>
    </select>
  </div>
  <button id="btn-load" onclick="loadHistory()">Load</button>
  <span id="ctrl-msg"></span>
</div>

<!-- MAIN CONTENT (filled on load) -->
<div id="main">
  <div class="loading-msg" id="empty-state">
    Select a date range above and click <strong>Load</strong> to view historical performance.
  </div>
  <div id="results" style="display:none"></div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const GREEN='#1D9E75', RED='#E24B4A', AMBER='#EF9F27', BLUE='#378ADD', PURPLE='#9b59b6', GREY='#6b7280';
const CUSTOMER_COLORS = {
  PEPKOR: BLUE, DCB: RED, MADIBANA: AMBER, BEX: PURPLE, PEP: GREEN,
  'PEP AFRICA': '#e67e22', SNOWSOFT: GREY
};

const GRID = 'rgba(255,255,255,0.05)';
Chart.defaults.color = '#8b97a8';
Chart.defaults.borderColor = GRID;
Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
Chart.defaults.font.size = 11;
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.pointStyle = 'circle';
Chart.defaults.plugins.legend.labels.boxWidth = 7;
Chart.defaults.plugins.legend.labels.boxHeight = 7;
Chart.defaults.plugins.legend.labels.padding = 14;
Chart.defaults.plugins.tooltip.backgroundColor = '#1c232e';
Chart.defaults.plugins.tooltip.borderColor = 'rgba(255,255,255,0.08)';
Chart.defaults.plugins.tooltip.borderWidth = 1;
Chart.defaults.plugins.tooltip.titleColor = '#e2e8f0';
Chart.defaults.plugins.tooltip.bodyColor = '#94a3b8';
Chart.defaults.plugins.tooltip.cornerRadius = 7;
Chart.defaults.plugins.tooltip.padding = 10;
Chart.defaults.plugins.tooltip.usePointStyle = true;
Chart.defaults.plugins.tooltip.boxWidth = 7;
Chart.defaults.plugins.tooltip.boxHeight = 7;

let charts = {};
let allMachines = [];
let lastScope = null;   // {customer, machine, location} of the loaded query

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt = n => (n==null) ? '—' : typeof n==='number' ? n.toLocaleString() : n;
const fmtPct = v => v==null ? '—' : Number(v).toFixed(1)+'%';
const grColor = v => { if(v==null) return GREY; if(v>=98) return GREEN; if(v>=90) return AMBER; return RED; };
const grPill = v => {
  const cls = v==null ? 'pill-grey' : v>=98 ? 'pill-green' : v>=90 ? 'pill-amber' : 'pill-red';
  return `<span class="pill ${cls}">${fmtPct(v)}</span>`;
};

function todayStr() {
  return new Date().toISOString().slice(0,10);
}
function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toISOString().slice(0,10);
}
function firstOfMonth(offset=0) {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - offset);
  return d.toISOString().slice(0,10);
}
function lastOfMonth(offset=0) {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - offset + 1);
  d.setDate(0);
  return d.toISOString().slice(0,10);
}

function setRange(days) {
  document.getElementById('date-from').value = offsetDate(days);
  document.getElementById('date-to').value = todayStr();
  document.querySelectorAll('.qr-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
function setThisMonth() {
  document.getElementById('date-from').value = firstOfMonth(0);
  document.getElementById('date-to').value = todayStr();
  document.querySelectorAll('.qr-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
function setLastMonth() {
  document.getElementById('date-from').value = firstOfMonth(1);
  document.getElementById('date-to').value = lastOfMonth(1);
  document.querySelectorAll('.qr-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

// ─── CLOCK ───────────────────────────────────────────────────────────────────
const clockEl = document.getElementById('utc-clock');
setInterval(()=>{
  const n = new Date();
  clockEl.textContent = [n.getUTCHours(),n.getUTCMinutes(),n.getUTCSeconds()].map(v=>String(v).padStart(2,'0')).join(':') + ' UTC';
},1000);

// ─── INIT DEFAULTS ───────────────────────────────────────────────────────────
document.getElementById('date-from').value = offsetDate(30);
document.getElementById('date-to').value = todayStr();

// ─── LOAD FILTERS FROM API ───────────────────────────────────────────────────
async function loadFilters() {
  try {
    const today = todayStr();
    const res = await fetch(`/api/history?date_from=${offsetDate(7)}&date_to=${today}`);
    if(!res.ok) return;
    const data = await res.json();

    const custSel = document.getElementById('filter-customer');
    custSel.innerHTML = '<option value="">All Customers</option>';
    (data.customers||[]).forEach(c=>{
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      custSel.appendChild(o);
    });

    allMachines = data.machines || [];
    updateMachineDropdown();

    custSel.addEventListener('change', updateMachineDropdown);
  } catch(e) {
    console.warn('Could not preload filters:', e);
  }
}

function updateMachineDropdown() {
  const customer = document.getElementById('filter-customer').value;
  const machSel = document.getElementById('filter-machine');
  const filtered = customer ? allMachines.filter(m=>m.customer===customer) : allMachines;
  machSel.innerHTML = '<option value="">All Machines</option>';

  // machine_name alone is not unique (several sites run a "DIM1"), so each
  // option carries its customer + location to pin one physical device.
  const addOption = (parent, m) => {
    const o = document.createElement('option');
    o.value = m.machine_name;
    o.dataset.customer = m.customer || '';
    o.dataset.location = m.location || '';
    o.textContent = m.location ? `${m.machine_name} · ${m.location}` : m.machine_name;
    parent.appendChild(o);
  };

  if(customer) {
    filtered.forEach(m=>addOption(machSel, m));
  } else {
    const byCustomer = new Map();
    filtered.forEach(m=>{
      if(!byCustomer.has(m.customer)) byCustomer.set(m.customer, []);
      byCustomer.get(m.customer).push(m);
    });
    byCustomer.forEach((ms, cust)=>{
      const g = document.createElement('optgroup');
      g.label = cust || '—';
      ms.forEach(m=>addOption(g, m));
      machSel.appendChild(g);
    });
  }
}

// ─── LOAD HISTORY ────────────────────────────────────────────────────────────
async function loadHistory() {
  const from = document.getElementById('date-from').value;
  const to = document.getElementById('date-to').value;
  const customer = document.getElementById('filter-customer').value;
  const machine = document.getElementById('filter-machine').value;
  const msg = document.getElementById('ctrl-msg');
  msg.textContent = '';

  if(!from || !to) { msg.textContent = 'Select both dates to load a range.'; return; }
  if(from > to) { msg.textContent = 'The From date must be on or before the To date.'; return; }

  const machSel = document.getElementById('filter-machine');
  const machOpt = machine ? machSel.selectedOptions[0] : null;
  const machCustomer = machOpt ? (machOpt.dataset.customer || '') : '';
  const machLocation = machOpt ? (machOpt.dataset.location || '') : '';
  lastScope = {
    customer: customer || machCustomer || null,
    machine: machine || null,
    location: machine ? (machLocation || null) : null
  };

  const btn = document.getElementById('btn-load');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('results').style.display = 'none';

  Object.values(charts).forEach(c=>c.destroy());
  charts = {};

  try {
    const params = new URLSearchParams({ date_from: from, date_to: to });
    const effCustomer = customer || machCustomer;   // pin the device even without a customer filter
    if(effCustomer) params.append('customer', effCustomer);
    if(machine) params.append('machine', machine);
    if(machine && machLocation) params.append('location', machLocation);

    const res = await fetch('/api/history?' + params);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    renderResults(data);
    document.getElementById('results').style.display = '';
  } catch(e) {
    const es = document.getElementById('empty-state');
    es.textContent = 'Could not load history (' + e.message + '). Check the connection and try Load again.';
    es.style.display = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Load';
  }
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function scopeLabel() {
  if(!lastScope || (!lastScope.customer && !lastScope.machine)) return 'Entire fleet';
  if(lastScope.machine) {
    const parts = [];
    if(lastScope.customer) parts.push(lastScope.customer);
    parts.push(lastScope.machine);
    if(lastScope.location) parts.push(lastScope.location);
    return parts.join(' · ');
  }
  return lastScope.customer + ' · all machines';
}

// Machines registered in the DB but with no statistics rows in the loaded
// period are absent from machineSummary entirely — surface them instead of
// letting them silently vanish. Respects the loaded scope.
function machinesWithoutData(d) {
  const key = m => `${m.machine_name}|${m.customer}|${m.location||''}`;
  const have = new Set((d.machineSummary||[]).map(key));
  let all = d.machines||[];
  if(lastScope) {
    if(lastScope.customer) all = all.filter(m=>m.customer===lastScope.customer);
    if(lastScope.machine) all = all.filter(m=>m.machine_name===lastScope.machine
      && (!lastScope.location || m.location===lastScope.location));
  }
  return all.filter(m=>!have.has(key(m)));
}

// One gauge tile: 270° arc, percentage in the metric's hue, and the raw
// count/total that produced it. `scaleMax` is shared across the row so the
// three arcs are comparable.
function gaugeTile(title, color, count, total, scaleMax) {
  const pct = total > 0 ? count / total * 100 : null;
  const fill = pct == null ? 0 : Math.min(100, pct / scaleMax * 100);
  const arc = 'M27.5 96.5 A46 46 0 1 1 92.5 96.5';
  return `
  <div class="panel">
    <div class="panel-header"><span class="panel-title">${title}</span></div>
    <div class="panel-body gauge-body">
      <div class="gauge-wrap">
        <svg viewBox="0 0 120 104" aria-hidden="true">
          <path d="${arc}" pathLength="100" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="11" stroke-linecap="round"/>
          ${fill > 0 ? `<path d="${arc}" pathLength="100" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${fill.toFixed(2)} 100"/>` : ''}
        </svg>
        <div class="gauge-value" style="color:${color}">${pct==null ? '—' : pct.toFixed(1)+'%'}</div>
      </div>
      <div class="gauge-counts"><b>${fmt(count)}</b> of <b>${fmt(total)}</b> items</div>
    </div>
  </div>`;
}

function renderResults(d) {
  const container = document.getElementById('results');

  const tot = (d.machineSummary||[]).reduce((acc,r)=>({
    total_items: acc.total_items+(r.total_items||0),
    good_read: acc.good_read+(r.good_read||0),
    no_read: acc.no_read+(r.no_read||0),
    hand_scanned: acc.hand_scanned+(r.hand_scanned||0),
    not_sent: acc.not_sent+(r.not_sent||0),
    no_dimension: acc.no_dimension+(r.no_dimension||0),
    out_of_spec: acc.out_of_spec+(r.out_of_spec||0),
    multi_item: acc.multi_item+(r.multi_item||0),
  }), {total_items:0,good_read:0,no_read:0,hand_scanned:0,not_sent:0,no_dimension:0,out_of_spec:0,multi_item:0});
  const totGrPct = tot.total_items > 0 ? (tot.good_read / tot.total_items * 100) : null;
  const days = (d.fleetDaily||[]).length;

  const gaugePcts = tot.total_items > 0
    ? [tot.no_dimension, tot.out_of_spec, tot.multi_item].map(c=>c/tot.total_items*100) : [0];
  const gaugeMax = Math.max(10, Math.ceil(Math.max(...gaugePcts) / 5) * 5);

  container.innerHTML = `
    <!-- Period summary -->
    <div class="summary-strip">
      <div class="sum-item">
        <div class="sum-value">${fmt(tot.total_items)}</div>
        <div class="sum-label">Total items</div>
      </div>
      <div class="sum-item">
        <div class="sum-value" style="color:${grColor(totGrPct)}">${fmtPct(totGrPct)}</div>
        <div class="sum-label">Good read</div>
      </div>
      <div class="sum-item">
        <div class="sum-value" style="color:${(tot.no_read>0)?RED:'var(--text-bright)'}">${fmt(tot.no_read)}</div>
        <div class="sum-label">No reads</div>
      </div>
      <div class="sum-item">
        <div class="sum-value">${fmt(tot.hand_scanned)}</div>
        <div class="sum-label">Hand scanned</div>
      </div>
      <div class="sum-item">
        <div class="sum-value" style="color:var(--muted)">${days}</div>
        <div class="sum-label">Days with data</div>
      </div>
      <div class="sum-item sum-scope">
        <div class="scope-line">${scopeLabel()}</div>
        <div class="scope-dates">${d.date_from} → ${d.date_to}</div>
      </div>
    </div>

    <!-- Scan quality gauges -->
    <div class="section-head">
      <h2>Scan quality</h2>
      <span class="section-note">Share of items in the period · arcs scaled to 0–${gaugeMax}%</span>
    </div>
    <div class="gauge-grid">
      ${gaugeTile('No Dimensions %', '#E17A16', tot.no_dimension, tot.total_items, gaugeMax)}
      ${gaugeTile('Out of Spec %',   '#EFD43B', tot.out_of_spec,  tot.total_items, gaugeMax)}
      ${gaugeTile('Multiple Items %','#9b59b6', tot.multi_item,   tot.total_items, gaugeMax)}
    </div>

    <!-- Daily trend -->
    <div class="section-head">
      <h2>Daily performance</h2>
      <span class="section-note">${scopeLabel()}</span>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Daily Items &amp; Good Read % — ${scopeLabel()}</span>
      </div>
      <div class="panel-body">
        <div class="chart-box chart-tall"><canvas id="chart-fleet-daily"></canvas></div>
      </div>
    </div>

    <!-- Customer trends -->
    <div class="section-head">
      <h2>Customer trends</h2>
      <span class="section-note">Good read target 98% · minimum 90%</span>
    </div>

    <div class="two-col two-col-5050">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Good Read % by Customer</span>
          <span class="panel-sub">Daily</span>
        </div>
        <div class="panel-body">
          <div class="chart-box"><canvas id="chart-cust-gr"></canvas></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Daily Items by Customer</span>
          <span class="panel-sub">Stacked</span>
        </div>
        <div class="panel-body">
          <div class="chart-box"><canvas id="chart-cust-vol"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Machine summary table -->
    <div class="section-head">
      <h2>Machine summary</h2>
      <span class="section-note">${d.date_from} → ${d.date_to}</span>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">All Machines — Period Totals</span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Machine</th>
              <th>Customer</th>
              <th>Site</th>
              <th style="text-align:right">Items</th>
              <th style="text-align:center">Good %</th>
              <th style="text-align:right">No Read</th>
              <th style="text-align:right">Hand Scan</th>
              <th style="text-align:right">Not Sent</th>
            </tr>
          </thead>
          <tbody id="tbody-machine-summary"></tbody>
          <tfoot id="tfoot-machine-summary"></tfoot>
        </table>
      </div>
    </div>

    <!-- Per-machine GR% chart -->
    <div class="section-head">
      <h2>Machine good read</h2>
      <span class="section-note">Period average, sorted ascending</span>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Good Read % by Machine</span>
      </div>
      <div class="panel-body">
        <div class="chart-box" id="machine-gr-box"><canvas id="chart-machine-gr"></canvas></div>
      </div>
    </div>
  `;

  renderFleetDailyChart(d);
  renderCustomerCharts(d);
  renderMachineSummaryTable(d);
  renderMachineGrChart(d);
}

function renderFleetDailyChart(d) {
  const daily = [...(d.fleetDaily||[])].sort((a,b)=>a.day.localeCompare(b.day));
  const labels = daily.map(r=>r.day);
  const items = daily.map(r=>r.total_items||0);
  const grPcts = daily.map(r=>r.total_items>0 ? (r.good_read/r.total_items*100) : null);
  const lastGr = grPcts.filter(v=>v!=null).pop();
  const grLine = grColor(lastGr);

  const ctx = document.getElementById('chart-fleet-daily').getContext('2d');
  charts.fleetDaily = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Total Items',
          data: items,
          borderColor: BLUE,
          backgroundColor: BLUE+'22',
          fill: 'origin',
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: labels.length > 60 ? 0 : 3,
          borderWidth: 2
        },
        {
          label: 'Good Read %',
          data: grPcts,
          borderColor: grLine,
          backgroundColor: 'transparent',
          tension: 0.3,
          yAxisID: 'y2',
          pointRadius: labels.length > 60 ? 0 : 3,
          borderWidth: 2.5,
          borderDash: [4,3],
          spanGaps: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: { legend: { position:'top' } },
      scales: {
        x: { grid:{display:false}, ticks:{maxTicksLimit:20, maxRotation:45} },
        y: { grid:{color:GRID}, ticks:{callback: v=>v>=1000?(v/1000).toFixed(0)+'k':v}, position:'left' },
        y2: { grid:{display:false}, position:'right', min:80, max:100, ticks:{callback:v=>v+'%', color:grLine} }
      },
      animation: false
    }
  });
}

function renderCustomerCharts(d) {
  const custDaily = d.customerDaily||[];
  const allDays = [...new Set(custDaily.map(r=>r.day))].sort();
  const customers = [...new Set(custDaily.map(r=>r.customer))];

  const grDatasets = customers.map(cust => {
    const color = CUSTOMER_COLORS[cust] || GREY;
    return {
      label: cust,
      data: allDays.map(day=>{ const r=custDaily.find(x=>x.day===day&&x.customer===cust); return r?r.good_read_pct:null; }),
      borderColor: color,
      backgroundColor: color+'33',
      tension: 0.3,
      spanGaps: true,
      pointRadius: allDays.length > 60 ? 0 : 3,
      borderWidth: 2
    };
  });
  grDatasets.push({ label:'98% Target', data:allDays.map(()=>98), borderColor:GREEN+'88', borderDash:[5,4], borderWidth:1.5, pointRadius:0, fill:false });
  grDatasets.push({ label:'90% Min', data:allDays.map(()=>90), borderColor:AMBER+'88', borderDash:[5,4], borderWidth:1.5, pointRadius:0, fill:false });

  charts.custGr = new Chart(document.getElementById('chart-cust-gr').getContext('2d'), {
    type:'line',
    data:{ labels: allDays, datasets: grDatasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'top'} },
      scales:{
        x:{grid:{display:false},ticks:{maxTicksLimit:15,maxRotation:45}},
        y:{min:0,max:100,grid:{color:GRID},ticks:{callback:v=>v+'%'}}
      },
      animation:false
    }
  });

  const volDatasets = customers.map(cust=>{
    const color = CUSTOMER_COLORS[cust] || GREY;
    return {
      label:cust,
      data:allDays.map(day=>{ const r=custDaily.find(x=>x.day===day&&x.customer===cust); return r?r.total_items:0; }),
      backgroundColor:color+'cc',
      borderRadius:2,
      stack:'s'
    };
  });

  charts.custVol = new Chart(document.getElementById('chart-cust-vol').getContext('2d'), {
    type:'bar',
    data:{ labels: allDays, datasets: volDatasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'top'} },
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{maxTicksLimit:15,maxRotation:45}},
        y:{stacked:true,grid:{color:GRID},ticks:{callback:v=>v>=1000?Math.round(v/1000)+'k':v}}
      },
      animation:false
    }
  });
}

function renderMachineSummaryTable(d) {
  const rows = [...(d.machineSummary||[])].sort((a,b)=>b.total_items-a.total_items);
  const tbody = document.getElementById('tbody-machine-summary');
  const tfoot = document.getElementById('tfoot-machine-summary');

  const noData = machinesWithoutData(d);
  tbody.innerHTML = rows.map((r,i)=>{
    const ns = r.not_sent||0;
    return `<tr>
      <td style="color:var(--faint)">${i+1}</td>
      <td style="font-weight:600">${r.machine_name||'—'}</td>
      <td>${r.customer||'—'}</td>
      <td>${r.location||'—'}</td>
      <td style="text-align:right">${fmt(r.total_items)}</td>
      <td style="text-align:center">${grPill(r.good_read_pct)}</td>
      <td style="text-align:right;color:${(r.no_read||0)>0?RED:GREY}">${fmt(r.no_read)}</td>
      <td style="text-align:right">${fmt(r.hand_scanned)}</td>
      <td style="text-align:right;${ns>0?'color:'+RED+';font-weight:700':''}">${ns>0?fmt(ns):'—'}</td>
    </tr>`;
  }).join('') + noData.map((m,i)=>`<tr style="color:var(--faint)">
      <td>${rows.length+i+1}</td>
      <td style="font-weight:600">${m.machine_name||'—'}</td>
      <td>${m.customer||'—'}</td>
      <td>${m.location||'—'}</td>
      <td style="text-align:right">0</td>
      <td style="text-align:center"><span class="pill pill-grey">no scans</span></td>
      <td style="text-align:right">—</td>
      <td style="text-align:right">—</td>
      <td style="text-align:right">—</td>
    </tr>`).join('');

  const tot = rows.reduce((acc,r)=>({
    total_items:acc.total_items+(r.total_items||0),
    good_read:acc.good_read+(r.good_read||0),
    no_read:acc.no_read+(r.no_read||0),
    hand_scanned:acc.hand_scanned+(r.hand_scanned||0),
    not_sent:acc.not_sent+(r.not_sent||0)
  }),{total_items:0,good_read:0,no_read:0,hand_scanned:0,not_sent:0});
  const tGr = tot.total_items>0?(tot.good_read/tot.total_items*100):null;
  tfoot.innerHTML = `<tr>
    <td colspan="4">PERIOD TOTAL</td>
    <td style="text-align:right">${fmt(tot.total_items)}</td>
    <td style="text-align:center">${grPill(tGr)}</td>
    <td style="text-align:right;color:${tot.no_read>0?RED:GREY}">${fmt(tot.no_read)}</td>
    <td style="text-align:right">${fmt(tot.hand_scanned)}</td>
    <td style="text-align:right;${tot.not_sent>0?'color:'+RED+';font-weight:700':''}">${tot.not_sent>0?fmt(tot.not_sent):'—'}</td>
  </tr>`;
}

function renderMachineGrChart(d) {
  const active = [...(d.machineSummary||[])].filter(m=>m.total_items>0).sort((a,b)=>a.good_read_pct-b.good_read_pct);
  const idle = [...(d.machineSummary||[])].filter(m=>!(m.total_items>0)).concat(machinesWithoutData(d));
  const machines = [...active, ...idle];
  const custFiltered = lastScope && lastScope.customer;
  const labels = machines.map(m=>{
    const parts = [m.machine_name];
    if(!custFiltered && m.customer) parts.push(m.customer);
    if(m.location) parts.push(m.location);
    return parts.join(' · ');
  });
  const values = machines.map(m=>(m.total_items>0) ? m.good_read_pct : 0);
  const colors = machines.map(m=>(m.total_items>0)
    ? (m.good_read_pct>=98?GREEN:m.good_read_pct>=90?AMBER:RED)
    : 'rgba(107,114,128,0.3)');
  const rowIdle = machines.map(m=>!(m.total_items>0));

  const dynH = Math.max(200, machines.length * 26 + 40);
  const canvas = document.getElementById('chart-machine-gr');
  document.getElementById('machine-gr-box').style.height = dynH + 'px';

  charts.machineGr = new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{
      labels,
      datasets:[{
        data:values,
        backgroundColor:colors,
        borderRadius:3,
        borderSkipped:false,
        barThickness:14
      }]
    },
    options:{
      indexAxis:'y',
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{ callbacks:{ label: ctx=>rowIdle[ctx.dataIndex] ? 'No scans in period' : `${ctx.parsed.x.toFixed(1)}%` } }
      },
      scales:{
        x:{min:0,max:100,grid:{color:GRID},ticks:{callback:v=>v+'%'}},
        y:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:10}}}
      },
      animation:false
    },
    plugins:[{
      id:'valLabels',
      afterDatasetsDraw(chart){
        const ctx=chart.ctx;
        chart.data.datasets[0].data.forEach((val,i)=>{
          const meta=chart.getDatasetMeta(0);
          const bar=meta.data[i];
          ctx.save();
          ctx.fillStyle=rowIdle[i] ? '#5f6b7d' : '#e2e8f0';
          ctx.font=(rowIdle[i] ? '500' : '600')+' 10px Inter,sans-serif';
          ctx.textAlign='left';
          ctx.textBaseline='middle';
          ctx.fillText(rowIdle[i] ? 'no scans in period' : val.toFixed(1)+'%',bar.x+4,bar.y);
          ctx.restore();
        });
      }
    }]
  });
}

// ─── INIT ────────────────────────────────────────────────────────────────────
loadFilters();
</script>
