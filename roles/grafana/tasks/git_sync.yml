---
# Configure Grafana Git Sync via the k8s provisioning API (Grafana v12+)
# Only runs when grafana_git_sync_repo is set.
#
# Idempotent by matching on spec.github.url, not by "does any repository
# exist yet" -- the previous create-only-if-list-is-empty check had two
# problems: (1) it raced Grafana's provisioning search index, which is not
# rebuilt until some time after container start, so a fresh restart could
# see an empty list and attempt a duplicate create; (2) once a repository
# existed, its token was never touched again, so rotating
# grafana_git_sync_token in vault never reached Grafana and the existing
# repository silently ran forever on the old token ("not authorized").

- name: Wait for Grafana API to be ready
  ansible.builtin.uri:
    url: "{{ grafana_api_scheme }}://{{ grafana_api_host }}:{{ grafana_api_port }}/api/health"
    method: GET
    status_code: [200]
    validate_certs: "{{ grafana_api_validate_certs | bool }}"
    url_username: "{{ grafana_admin_user | default('admin') }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
  register: grafana_gitsync_health
  retries: 30
  delay: 2
  until: grafana_gitsync_health.status == 200

- name: List Git Sync repositories
  ansible.builtin.uri:
    url: "{{ grafana_api_scheme }}://{{ grafana_api_host }}:{{ grafana_api_port }}/apis/provisioning.grafana.app/v0alpha1/namespaces/default/repositories"
    method: GET
    status_code: [200]
    validate_certs: "{{ grafana_api_validate_certs | bool }}"
    url_username: "{{ grafana_admin_user | default('admin') }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    return_content: true
  register: grafana_gitsync_repos

- name: Find existing repository matching our URL
  ansible.builtin.set_fact:
    grafana_gitsync_existing: >-
      {{ (grafana_gitsync_repos.json.items | default([]))
         | selectattr('spec.github.url', 'defined')
         | selectattr('spec.github.url', 'equalto', grafana_git_sync_repo)
         | list | first | default(None) }}

- name: Build desired Git Sync repository spec
  ansible.builtin.set_fact:
    grafana_gitsync_body:
      apiVersion: "provisioning.grafana.app/v0alpha1"
      kind: "Repository"
      metadata:
        name: "{{ grafana_gitsync_existing.metadata.name if grafana_gitsync_existing else 'systems-one-dashboards' }}"
        namespace: "default"
      spec:
        type: "github"
        github:
          url: "{{ grafana_git_sync_repo }}"
          branch: "{{ grafana_git_sync_branch | default('main') }}"
          token: "{{ grafana_git_sync_token }}"
          path: "{{ grafana_git_sync_path | default('grafana/') }}"
          showDashboardChanges: true
          generateDashboardPreviews: false
        sync:
          enabled: true
          target: "instance"
          intervalSeconds: 60

- name: Update existing Git Sync repository (refreshes token on rotation)
  ansible.builtin.uri:
    url: "{{ grafana_api_scheme }}://{{ grafana_api_host }}:{{ grafana_api_port }}/apis/provisioning.grafana.app/v0alpha1/namespaces/default/repositories/{{ grafana_gitsync_existing.metadata.name }}"
    method: PUT
    status_code: [200]
    validate_certs: "{{ grafana_api_validate_certs | bool }}"
    url_username: "{{ grafana_admin_user | default('admin') }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
    body_format: json
    body: "{{ grafana_gitsync_body }}"
  no_log: true
  when: grafana_gitsync_existing is not none
  register: grafana_gitsync_update
  changed_when: grafana_gitsync_update.status == 200

- name: Create Git Sync repository
  ansible.builtin.uri:
    url: "{{ grafana_api_scheme }}://{{ grafana_api_host }}:{{ grafana_api_port }}/apis/provisioning.grafana.app/v0alpha1/namespaces/default/repositories"
    method: POST
    status_code: [200, 201]
    validate_certs: "{{ grafana_api_validate_certs | bool }}"
    url_username: "{{ grafana_admin_user | default('admin') }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
    body_format: json
    body: "{{ grafana_gitsync_body }}"
  no_log: true
  when: grafana_gitsync_existing is none
  register: grafana_gitsync_create
  changed_when: grafana_gitsync_create.status in [200, 201]
